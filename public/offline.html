<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12233a">
<title>Offline · SocialUs</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #fff; color: #1a1a1a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 22rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: #6b6b6b; margin: 0 0 1.5rem; line-height: 1.5; }
  button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px; background: #24405a; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>SocialUs needs a connection to show what's happening near you. Try again when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
