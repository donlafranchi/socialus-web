name: Knowledge upkeep

# F128.7 (#1237): monthly, opens one Issue listing what the store says is due:
# practices not confirmed in 90 days, experiments past their verdict date,
# routines with no run in their interval, ideas open more than 90 days
# (scripts/knowledge/upkeep.ts). Skips if last month's Issue is still open.
#
# Reads only. A key is minted for the run and the transaction is rolled back,
# so the run leaves nothing in the store.

on:
  schedule:
    - cron: '17 15 1 * *'   # the 1st of each month, 15:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: knowledge-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    name: Open the monthly upkeep Issue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The same connection apply.yml uses (scripts/supabase-db-url.sh).
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: List what is due and open the Issue
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/knowledge/upkeep.ts --open-issue
