name: Apply migrations to PRODUCTION

# The only thing in this repo that writes to socialus-db.
#
# MANUAL ONLY. There is no push trigger and no schedule: nothing applies to
# production unless a person comes here and runs it. That is the whole safety
# model, since GitHub's environment approval gates are a paid feature on
# private repos and are not available here.
#
# ALWAYS the Supabase CLI (`supabase db push`), NEVER the management API.
# On 2026-09-11 two migrations were applied through the management API's
# apply_migration endpoint. That endpoint executes whatever SQL it is handed
# and writes a history row named after whatever it is told — it never reads
# supabase/migrations/. Local and remote diverged immediately and silently.
# `db push` reads the files and records their versions, which is the only way
# the migration files stay the source of truth. Do not "simplify" this job by
# calling the API.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm writing to the production database. FIRST check "Use workflow from" above — a migration under review is on its branch, not main.'
        required: true
        type: string
      allow_multiple:
        description: 'Apply more than one pending migration in this run. Leave unchecked: one PR, one migration, verified before the next (#264).'
        required: false
        type: boolean
        default: false

# The guard below reads the branch's pull requests; nothing here writes to GitHub.
permissions:
  contents: read
  pull-requests: read

# Never two pushes against one database at once.
concurrency:
  group: migrations-apply-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply to socialus-db
    # PINNED, not ubuntu-latest. The `ubuntu-latest` label migrates to Ubuntu 26
    # from 2026-10-19 — eleven days before launch. An unpinned runner would
    # change the OS, the preinstalled toolchain and the default package
    # versions underneath us in the worst week of the project, and the first
    # symptom would be a job failing for a reason unrelated to any change we
    # made. 24.04 is exactly what every run has been using; this pins what is
    # already proven rather than adopting anything new.
    #
    # Revisit after launch: this is a deliberate freeze, not a preference.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A Run button sitting next to a production database is easier to press
      # by accident than an approval prompt is to click through. Typing the
      # word is the substitute for the approval gate we cannot have.
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo "::error::Confirmation failed. Type exactly: apply"
            echo "Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmed. Applying migrations to socialus-db."

      # Full history and every remote branch: the preflight below names which
      # OTHER ref has a pending migration when this one has none, and it cannot
      # do that from a single-commit shallow clone of one branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      #
      # `version: latest` makes this step call the GitHub releases API on every
      # run. On 2026-09-21 that API rate-limited, the step failed with
      # "Failed to resolve latest Supabase CLI release", and the whole
      # migrations check went red for a reason unrelated to any migration —
      # so the one job that watches the schema was dark on the day a migration
      # merged unapplied and took every Page URL down.
      #
      # A pinned version needs no API call and cannot be rate-limited. Bump it
      # deliberately; do not put `latest` back.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      # NOT `supabase link`. `link` calls GET /v1/projects/{ref}/api-keys
      # ?reveal=true to resolve the service-role secret, and a scoped access
      # token cannot reveal it — supabase/supabase#50244, which returns 403
      # even at Full access. That is what failed the first real run of this
      # workflow (run 34909360794, 2026-09-14): it died here, before any
      # migration was attempted, and regenerating the token does not help.
      #
      # The drift job in migrations.yml already solved this by talking straight
      # to Postgres. This mirrors it rather than inventing a second way, so
      # there is one connection path in this repo and one place to fix it.
      # Reasoning in full at the top of scripts/supabase-db-url.sh.
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Before and after are printed into the log so the run itself is the
      # record of what the history looked like on both sides. This is the
      # check that would have caught the 2026-09-11 drift the same day.
      - name: History before
        run: supabase migration list --db-url "${{ steps.dburl.outputs.url }}"

      # THE WRONG-REF GUARD.
      #
      # `workflow_dispatch` shows a "Use workflow from" dropdown that defaults
      # to main. A migration under review lives on its branch until the PR
      # merges, so accepting the default runs this job against a ref with
      # nothing pending — `db push` prints "Remote database is up to date", the
      # job goes green, and nothing was applied. A green run and a run that did
      # nothing look identical from the run list. That cost two round trips.
      #
      # So the job REFUSES to be a silent no-op, and when it refuses it names
      # the branch to pick instead. A note in a PR body was the alternative and
      # it relies on someone remembering the thing they just forgot.
      #
      # It also prints what it is about to apply BEFORE applying it, so the log
      # says what changed rather than only that something did.
      - name: What would this apply?
        env:
          SUPABASE_DB_URL: ${{ steps.dburl.outputs.url }}
          PENDING_OUT: ${{ runner.temp }}/pending.txt
        run: bash scripts/migrations-pending.sh

      # THE AHEAD-OF-ITS-CODE GUARD (#264). On 2026-09-30 three stacked
      # migration PRs were applied before any of their code merged, and every
      # signed-out Page 404'd until it did. It refuses a branch whose open PR
      # does not target main, and more than one pending migration unless
      # allow_multiple is checked.
      #
      # [guard-proves-itself]: it is first run against a stacked fixture and
      # must refuse it, in this job, on every run, before it is trusted.
      - name: The guard refuses a stacked branch (self-test)
        env:
          BRANCH: guard-self-test
          PR_BASES: some-other-branch
          PENDING: '1'
        run: |
          if bash scripts/migrations-apply-guard.sh; then
            echo "::error::The guard passed a stacked fixture. It is not working; refusing to apply anything."
            exit 1
          fi
          echo "Self-test: the guard refused the stacked fixture, as it must."

      - name: Refuse what would run ahead of its code
        env:
          BRANCH: ${{ github.ref_name }}
          PENDING_FILE: ${{ runner.temp }}/pending.txt
          ALLOW_MULTIPLE: ${{ inputs.allow_multiple }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/migrations-apply-guard.sh

      # Idempotent: applies only what the remote history lacks. Re-running
      # after a success is a no-op, not a second application.
      - name: Push migrations
        run: supabase db push --db-url "${{ steps.dburl.outputs.url }}"

      - name: History after
        run: supabase migration list --db-url "${{ steps.dburl.outputs.url }}"

      # Nothing pending and nothing undocumented: the repo and the database
      # agree in both directions before this job is allowed to go green.
      - name: Confirm repo and database now agree
        env:
          SUPABASE_DB_URL: ${{ steps.dburl.outputs.url }}
        run: bash scripts/check-migration-drift.sh --strict
