name: Open your town — the round

# F118 (socialus-plan) — daily: mark the towns that reached both goals (the first 3 this round) and
# log each as an Issue for a person to open with scripts/market/open-market.ts.
on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: town-round
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Mark ready towns and log them
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npx tsx scripts/market/town-round.ts > ready.jsonl
          while read -r line; do
            [ -z "$line" ] && continue
            slug=$(echo "$line" | jq -r .slug); name=$(echo "$line" | jq -r .name); key=$(echo "$line" | jq -r .market_key); rank=$(echo "$line" | jq -r .ready_rank)
            gh issue create --title "chore · open $name: it reached both goals" --body "$(printf 'Kind: chore\nScenario: F118\nPath: well-worn\n\n%s is ready to open, number %s of 3 this round (%s).\n\nOpen it: `npx tsx scripts/market/open-market.ts %s`. A county market has no markets row yet; add one (and its feed area) first.' "$name" "$rank" "$line" "$key")" \
              && npx tsx scripts/market/town-round.ts --logged "$slug"
          done < ready.jsonl
