name: Knowledge capabilities

# F129 (#1239): keeps "what SocialUs can and can't do" true in the knowledge
# store, nightly after the live smoke, and writes the same answer as one
# Markdown pack into socialus-plan (handoff/what-socialus-can-do.md) for a
# chat project (scripts/knowledge/capabilities.ts).
#
# A line is "can" only when its criteria are shipped and checked in
# build-log/reports/rollup.json (or its F127 slice is shipped) and the open
# `bug · live:` Issue from the overnight smoke names none of its routes.
#
# The pack is pushed when any line changed, and on the 1st of each month
# regardless. Pushing to socialus-plan needs the KNOWLEDGE_WRITE_TOKEN secret: a
# fine-grained token with contents write on socialus-plan and socialus-ops only,
# shared with the practices pack (F128). Without it
# the store is still kept true and the run says the pack was not pushed.
#
# Writes to the store only through its functions, as its own login, with a
# key minted for this run and revoked at its end.

on:
  schedule:
    - cron: '47 11 * * *'   # 11:47 UTC daily, after the 10:30 live smoke
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: do everything, write nothing to the store, push no pack'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

concurrency:
  group: knowledge-capabilities
  cancel-in-progress: false

jobs:
  capabilities:
    name: What SocialUs can do
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Without the token this checkout may fail (socialus-plan is another
      # repository); the store is still kept true and the push step says so.
      - name: Check out socialus-plan, to write the pack
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: donlafranchi/socialus-plan
          path: .knowledge/socialus-plan
          token: ${{ secrets.KNOWLEDGE_WRITE_TOKEN || github.token }}
          persist-credentials: ${{ secrets.KNOWLEDGE_WRITE_TOKEN != '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The same connection apply.yml uses (scripts/supabase-db-url.sh).
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Bring every line in line with tonight's evidence
        id: lines
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p .knowledge/socialus-plan/handoff
          args=(--out .knowledge/socialus-plan/handoff/what-socialus-can-do.md)
          if [ "$DRY_RUN" != "true" ]; then args+=(--commit); else echo "Dry run: nothing will be written."; fi
          npx tsx scripts/knowledge/capabilities.ts "${args[@]}"

      # Runs even when a words line had a problem: the store moved, so the pack follows.
      - name: Push the pack to socialus-plan
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          HAS_TOKEN: ${{ secrets.KNOWLEDGE_WRITE_TOKEN != '' }}
          CHANGED: ${{ steps.lines.outputs.pack_changed }}
        working-directory: .knowledge/socialus-plan
        run: |
          monthly=$([ "$(date -u +%d)" = "01" ] && echo true || echo false)
          if [ "$CHANGED" != "true" ] && [ "$monthly" != "true" ]; then
            echo "- Pack: unchanged, not pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::The pack changed but KNOWLEDGE_WRITE_TOKEN is not set, so it was not pushed to socialus-plan."
            echo "- Pack: changed, NOT pushed (no KNOWLEDGE_WRITE_TOKEN secret)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "socialus-web knowledge capabilities"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/what-socialus-can-do.md
          if git diff --cached --quiet; then echo "- Pack: already up to date in socialus-plan." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m "chore: what SocialUs can do, regenerated ($([ "$CHANGED" = "true" ] && echo "a line changed" || echo "monthly"))" \
            -m "Generated by socialus-web .github/workflows/knowledge-capabilities.yml, run $GITHUB_RUN_ID."
          git pull --rebase --quiet
          git push
          echo "- Pack: pushed to socialus-plan." >> "$GITHUB_STEP_SUMMARY"
