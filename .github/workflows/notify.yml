name: Notifications

# #904 (Don, 2026-10-18, option A) — opt-in web push. Every 15 minutes: followed Pages' new posts, batched and
# capped. Thursday evening: this weekend near you (hourly 5–9 pm Pacific, so quiet hours can end; once a week each).
# Monday: the counts to the notify-history branch, for the dashboard. The 1st of the month: the review Issue.
# By hand: gh workflow run notify.yml -f job=follow|weekend|stats|review

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 0-4 * * 5' # Thursday 17:00–21:00 Pacific (PDT)
    - cron: '20 15 * * 1' # Monday 08:20 Pacific
    - cron: '40 15 1 * *' # the 1st, 08:40 Pacific
  workflow_dispatch:
    inputs:
      job:
        description: follow | weekend | stats | review
        required: true
        default: follow

permissions:
  contents: write # only to append the counts to the notify-history branch (never main)
  issues: write

concurrency:
  group: notify-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JOB: ${{ inputs.job || (github.event.schedule == '*/15 * * * *' && 'follow') || (github.event.schedule == '0 0-4 * * 5' && 'weekend') || (github.event.schedule == '20 15 * * 1' && 'stats') || 'review' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Run ${{ env.JOB }}
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          mkdir -p notify-out
          case "$JOB" in
            stats) npx tsx scripts/notify/run.ts stats notify-out/latest.json ;;
            review) npx tsx scripts/notify/run.ts review notify-out/review.md ;;
            *) npx tsx scripts/notify/run.ts "$JOB" ;;
          esac

      # One small JSON a week on the notify-history branch (not main, so no deploy): counts only.
      - name: Record the counts
        if: env.JOB == 'stats'
        run: |
          day="$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin notify-history > /dev/null; then
            git fetch --depth=1 origin notify-history
            git worktree add -B notify-history ../nh FETCH_HEAD
          else
            git worktree add --orphan -b notify-history ../nh
          fi
          mkdir -p ../nh/history
          cp notify-out/latest.json ../nh/latest.json
          cp notify-out/latest.json "../nh/history/$day.json"
          cd ../nh
          git add -A
          git commit -m "notification counts $day" || exit 0
          git push origin notify-history

      # The monthly review: one Issue a month with the numbers and every string, for the review session to act on.
      - name: Open the review Issue
        if: env.JOB == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          month="$(date -u +%Y-%m)"
          title="chore · notifications review $month"
          gh label create notifications-review --color 0E8A16 --description "#904 monthly review" 2>/dev/null || true
          body="$(printf 'Kind: chore\nScenario: none\nPath: well-worn\n\n'; cat notify-out/review.md)"
          n="$(gh issue list --label notifications-review --state open --search "in:title $month" --json number --jq '.[0].number')"
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --label notifications-review --body "$body"; fi
