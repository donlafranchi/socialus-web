name: tap-speed

# #527 — tap speed on production, nightly: a mid-range phone on 4G taps through the live site, read-only. Feedback, URL
# change and usable content per tap, against budgets (src/lib/speed/judge.ts) and the baseline in evals/speed/baseline.json.
# Moved out of smoke-live.yml (#663): that workflow means "a screen errors or leaks"; this one means "a tap is too slow".
# Same steps, budgets, bug filing (`bug · live: taps are slower than budget`, not launch-blocking), history and artifact.
# 11:00 UTC, after smoke-live (10:30) and before the 5am handoff.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    # #791 — a one-off look at a few taps: only those, with a Chrome performance trace each. Not recorded as history.
    inputs:
      only:
        description: 'Only taps whose name contains this (blank: all)'
        required: false
        default: ''
      trace:
        description: 'Save a Chrome performance trace per tap'
        type: boolean
        default: false

permissions:
  contents: write # only to append the tap-speed history to the perf-history branch (never main)
  issues: write

concurrency:
  group: tap-speed
  cancel-in-progress: false

jobs:
  speed:
    name: Tap speed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --only-shell chromium

      # #527 — tap speed: a mid-range phone on 4G taps through production, read-only.
      # Feedback, URL change and usable content per tap, against budgets
      # (src/lib/speed/judge.ts). Fails on a stall, a screen that never shows,
      # or a slowdown past evals/speed/baseline.json. One worker, so timings
      # do not compete; the summary lands on the run page.
      - name: Tap speed on production, read-only
        id: speed
        if: ${{ !cancelled() }}
        env:
          BUILDERS_BASE_URL: https://www.socialus.org
          BUILDER_SEED: ${{ secrets.BUILDER_SEED }}
          SPEED_ONLY: ${{ inputs.only }}
          SPEED_TRACE: ${{ inputs.trace && '1' || '' }}
        run: |
          rm -rf speed-out
          npx playwright test --project=tap-speed --reporter=line 2>&1 | tee speed.log
          code="${PIPESTATUS[0]}"
          npx tsx evals/speed/summarize.ts > /dev/null
          exit "$code"

      # #527 — one small JSON per night on the perf-history branch (not main, so no
      # deploy): the trend, and the file the dashboard reads (latest.json).
      - name: Record the tap-speed history
        if: ${{ !cancelled() && steps.speed.conclusion != 'skipped' && !inputs.only }}
        run: |
          [ -f speed-out/perf-latest.json ] || { echo "No tap-speed result to record."; exit 0; }
          day="$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin perf-history > /dev/null; then
            git fetch --depth=1 origin perf-history
            git worktree add -B perf-history ../ph FETCH_HEAD
          else
            git worktree add --orphan -b perf-history ../ph
          fi
          mkdir -p ../ph/history
          cp speed-out/perf-latest.json ../ph/latest.json
          cp speed-out/perf-latest.json "../ph/history/$day.json"
          cd ../ph
          git add -A
          git commit -m "tap speed $day" || exit 0
          git push origin perf-history

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: tap-speed
          path: |
            speed-out/rows.jsonl
            speed-out/summary.md
            speed-out/perf-latest.json
            speed-out/trace-*.json
            speed.log
          retention-days: 14
          if-no-files-found: ignore

      - name: File a tap-speed bug
        if: ${{ failure() && steps.speed.conclusion == 'failure' && !inputs.only }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('speed-out/summary.md') ? fs.readFileSync('speed-out/summary.md', 'utf8') : '';
            const slow = summary.split('**Slowest 10**')[1] ?? '';
            const title = 'bug · live: taps are slower than budget';
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `**Kind:** bug\n**Scenario:** none\n**Path:** well-worn: a tap that stalls or got slower than its baseline is a regression to fix forward.\n\nThe overnight tap-speed run (mid-range phone, 4G, read-only) failed: ${run}\n\nSlowest ten:${slow}\n\nThe full table is the run's summary and its \`tap-speed\` artifact. Budgets: consumer feedback 100 ms and content 1 s; creator 2.5 s.`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: 'bug', per_page: 100 });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Again: ${run}\n\nSlowest ten:${slow}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['bug', 'area:ops'] });
            }
