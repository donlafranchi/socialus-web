name: migrations (check)

# Applies database migrations to socialus-db, and guards against the repo and
# the database drifting apart.
#
# ALWAYS the Supabase CLI (`supabase db push`), NEVER the management API.
# On 2026-09-11 two migrations were applied through the management API's
# apply_migration endpoint. That endpoint executes whatever SQL it is handed
# and writes a history row named after whatever it is told — it never reads
# supabase/migrations/. Local and remote diverged immediately and silently.
# `db push` reads the files and records their versions, which is the only way
# the migration files stay the source of truth. Do not "simplify" this job by
# calling the API.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Nothing applies automatically, so main can carry a migration the database
  # has not seen. That window is exactly the state that caused the 2026-09-11
  # divergence, and silence is what made it last. This makes it noisy instead:
  # a daily run that goes red, and emails, for as long as anything is pending.
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations.yml'
      - 'scripts/check-migration-drift.sh'
      - 'scripts/supabase-db-url.sh'

# One migration job at a time. Two concurrent `db push` runs against one
# database is exactly the race this whole workflow exists to prevent.
concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate 1 — do these migrations actually apply, from nothing, in order?
  # Runs on PRs and on main. No secrets, no production contact: a throwaway
  # local Supabase stack built from the files in this commit.
  verify:
    name: Migrations apply from scratch
    # PINNED, not ubuntu-latest. The `ubuntu-latest` label migrates to Ubuntu 26
    # from 2026-10-19 — eleven days before launch. An unpinned runner would
    # change the OS, the preinstalled toolchain and the default package
    # versions underneath us in the worst week of the project, and the first
    # symptom would be a job failing for a reason unrelated to any change we
    # made. 24.04 is exactly what every run has been using; this pins what is
    # already proven rather than adopting anything new.
    #
    # Revisit after launch: this is a deliberate freeze, not a preference.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      #
      # `version: latest` makes this step call the GitHub releases API on every
      # run. On 2026-09-21 that API rate-limited, the step failed with
      # "Failed to resolve latest Supabase CLI release", and the whole
      # migrations check went red for a reason unrelated to any migration —
      # so the one job that watches the schema was dark on the day a migration
      # merged unapplied and took every Page URL down.
      #
      # A pinned version needs no API call and cannot be rate-limited. Bump it
      # deliberately; do not put `latest` back.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Start a throwaway local stack
        run: bash scripts/supabase-start.sh

      # The real check: every migration, from an empty database, in order.
      # This is what would have caught a migration that only applies when
      # some earlier hand-run state already exists.
      - name: Apply every migration from scratch
        run: supabase db reset

      - run: npm ci

      # The migration tests are static-shape guards over the SQL files. They
      # are the part of the suite that speaks to migrations, and they are
      # green — see the note on gating in the PR body.
      - name: Migration tests
        run: npx vitest run tests/migrations-*.test.ts tests/rls-coverage.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # This job starts a local Supabase from nothing and throws it away
          # when the runner ends, so the ephemeral assertion is simply true
          # here. Stating it is what lets the write-bound suites run; without
          # it they go red with "carries no ephemeral marker", which is the
          # guard working rather than a problem to route around.
          #
          # It is safe *because* it is stated per job. T151's rule holds: the
          # marker alone never enables a write suite — the host must also be
          # local or a branch, and the production ref is refused whatever any
          # variable says.
          SUPABASE_TEST_EPHEMERAL: '1'

  # Gate 2 — has anything reached the database without going through a file?
  # Local-only migrations are fine and expected on a PR. Remote-only ones are
  # drift, and always a failure.
  drift:
    name: No undocumented migrations in the database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      #
      # `version: latest` makes this step call the GitHub releases API on every
      # run. On 2026-09-21 that API rate-limited, the step failed with
      # "Failed to resolve latest Supabase CLI release", and the whole
      # migrations check went red for a reason unrelated to any migration —
      # so the one job that watches the schema was dark on the day a migration
      # merged unapplied and took every Page URL down.
      #
      # A pinned version needs no API call and cannot be rate-limited. Bump it
      # deliberately; do not put `latest` back.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Compare local files against the applied history
        env:
          SUPABASE_DB_URL: ${{ steps.dburl.outputs.url }}
        run: bash scripts/check-migration-drift.sh

  # Is production behind main? Only meaningful on main and on the schedule —
  # a PR is *supposed* to carry a migration the database lacks.
  #
  # IT USED TO REPORT AND PASS ON PUSH, on the reasoning that you have just
  # merged and of course it is pending. 2026-09-21 is what that reasoning
  # costs: a migration merged, the deploy went out against a database without
  # it, and every Page URL 404'd for an hour while this job sat green saying
  # "expected on a push". Only the daily schedule would have failed, by which
  # time Don had already found it himself.
  #
  # It fails on push now. A red main build the minute a migration is pending is
  # the point — the window between merge and apply is exactly the window the
  # outage lived in, and nothing else was watching it.
  pending:
    name: Production behind main?
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      #
      # `version: latest` makes this step call the GitHub releases API on every
      # run. On 2026-09-21 that API rate-limited, the step failed with
      # "Failed to resolve latest Supabase CLI release", and the whole
      # migrations check went red for a reason unrelated to any migration —
      # so the one job that watches the schema was dark on the day a migration
      # merged unapplied and took every Page URL down.
      #
      # A pinned version needs no API call and cannot be rate-limited. Bump it
      # deliberately; do not put `latest` back.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check for unapplied migrations
        env:
          SUPABASE_DB_URL: ${{ steps.dburl.outputs.url }}
        run: |
          bash scripts/check-migration-drift.sh --strict
