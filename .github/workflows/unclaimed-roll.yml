name: Unclaimed samples roll forward

# Don, 2026-10-16 — every Monday, move each unclaimed Page's finished sample posts on, so every Page always shows its
# next 1–3 weeks. Samples only; idempotent. By hand: gh workflow run unclaimed-roll.yml (dry run unless write is ticked).
on:
  schedule:
    - cron: '30 12 * * 1' # Mondays 05:30 Pacific (04:30 in winter)
  workflow_dispatch:
    inputs:
      write:
        description: 'Tick to write to the production database. Unticked, it only counts.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unclaimed-load
  cancel-in-progress: false

jobs:
  roll:
    name: Roll samples forward
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Roll
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          # The schedule always writes; a dispatch writes only when ticked.
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
        run: |
          if [ "$WRITE" = "true" ]; then npx tsx scripts/unclaimed/roll.ts --apply; else npx tsx scripts/unclaimed/roll.ts; fi
