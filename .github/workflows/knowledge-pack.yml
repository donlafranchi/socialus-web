name: Knowledge pack

# F128 (#1237): writes the pack of how we work (how-we-work.md, under 10,000
# tokens) and the review-a-method steps beside it into socialus-ops
# packs/ (exempt from socialus-ops doc budgets, #177), ready to add to a Claude Project (scripts/knowledge/pack.ts).
#
# When: after every Knowledge import, which is how a practice, its ring or its
# strength changes, and on the 1st of each month regardless (F128 ruling,
# 2026-11-10: rewritten when a practice changes and once a month, not
# nightly). After an import it writes only if the pack's words changed.
#
# Writing to socialus-ops: through a pull request there, never straight to
# its main, which requires its own `lint` check. The pack goes on one branch,
# knowledge-pack, so at most one pack PR is open; the run opens it if none is
# open and turns on auto-merge (squash), so socialus-ops' lint runs and merges
# it. The secret KNOWLEDGE_WRITE_TOKEN is one fine-grained token with Contents
# and Pull requests read and write on socialus-ops and socialus-plan only,
# shared with F129's socialus-plan write. Without it, the pack goes in the
# run's summary and as an artifact, and nothing is pushed.
#
# The monthly run also opens one Issue listing practices not confirmed in 90
# days and experiments past their verdict date, for the PM (F128.7).
#
# Reads only from the store: a key is minted for the run and rolled back.

on:
  workflow_run:
    workflows: ['Knowledge import']
    types: [completed]
  schedule:
    - cron: '17 15 1 * *'   # the 1st of each month, 15:17 UTC
  workflow_dispatch:
    inputs:
      monthly:
        description: 'Write the pack even if nothing changed, and list the upkeep.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: knowledge-pack
  cancel-in-progress: false

jobs:
  pack:
    name: Write the how-we-work pack
    # After an import that succeeded. A dry run changes nothing in the store,
    # so its pack comes out the same and nothing is written.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_WRITE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: donlafranchi/socialus-ops
          path: .knowledge/socialus-ops
          token: ${{ secrets.KNOWLEDGE_WRITE_TOKEN || github.token }}
          fetch-depth: 0   # the pack branch merges main in, which needs the history

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The same connection apply.yml uses (scripts/supabase-db-url.sh).
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write the pack
        id: pack
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONTHLY: ${{ github.event_name == 'schedule' || inputs.monthly == true }}
        run: |
          flags=""
          if [ "$MONTHLY" = "true" ]; then flags="--monthly --open-issue"; fi
          npx tsx scripts/knowledge/pack.ts --ops .knowledge/socialus-ops $flags

      - uses: actions/upload-artifact@v6
        if: steps.pack.outputs.written == 'true'
        with:
          name: how-we-work-pack
          path: .knowledge/socialus-ops/packs/

      - name: Open or update the pack PR in socialus-ops
        if: steps.pack.outputs.written == 'true' && env.HAS_WRITE_TOKEN == 'true'
        working-directory: .knowledge/socialus-ops
        env:
          GH_TOKEN: ${{ secrets.KNOWLEDGE_WRITE_TOKEN }}
          BRANCH: knowledge-pack
        run: |
          git config user.name "socialus-knowledge-pack"
          git config user.email "socialus-knowledge-pack@users.noreply.github.com"
          # The pack was written on main's checkout; carry it onto the one pack branch.
          cp -r packs "$RUNNER_TEMP/packs"
          git checkout -- . && git clean -fdq packs
          if git fetch -q origin "$BRANCH" 2>/dev/null; then
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
            # Bring main in with a merge, never a rewrite, so the branch stays current.
            git merge -q --no-edit origin/main
          else
            git checkout -q -B "$BRANCH"
          fi
          rm -rf packs && cp -r "$RUNNER_TEMP/packs" packs
          git add packs
          if git diff --cached --quiet; then echo "The pack branch already holds this pack."; else
            git commit -q -m "chore: how-we-work pack, written from the knowledge store (F128)" -m "By the Knowledge pack workflow in socialus-web, run ${{ github.run_id }}."
          fi
          git push -q origin "$BRANCH"
          pr="$(gh pr list --repo donlafranchi/socialus-ops --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --repo donlafranchi/socialus-ops --head "$BRANCH" --base main \
              --title "chore · how-we-work pack from the knowledge store" \
              --body "Written by the Knowledge pack workflow in socialus-web (F128). Generated from the knowledge store: packs/how-we-work.md and packs/review-a-method.md. Merges itself once lint passes."
            pr="$(gh pr list --repo donlafranchi/socialus-ops --head "$BRANCH" --state open --json number -q '.[0].number')"
          fi
          gh pr merge "$pr" --repo donlafranchi/socialus-ops --auto --squash
          echo "Pack PR: https://github.com/donlafranchi/socialus-ops/pull/$pr" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say why nothing was pushed
        if: steps.pack.outputs.written == 'true' && env.HAS_WRITE_TOKEN != 'true'
        run: echo "KNOWLEDGE_WRITE_TOKEN is not set, so the pack is only in this run's summary and artifact." | tee -a "$GITHUB_STEP_SUMMARY"
