name: CI

# What every PR is checked against.
#
# Until this existed, "green" on a PR meant Vercel had built a preview and
# `issue-lint` had read the description. 131 unit test files, 24 Playwright
# specs and a lint script existed in the repo and none of them ran on a PR —
# every merge on 2026-09-16 was green without a single test executing.
#
# Two jobs, split on whether they need a database:
#
#   quality — lint, types, production build. Seconds, no services.
#   test    — the Vitest suite against a throwaway local Supabase.
#   browser — Playwright: the feature evals and the screenshot matrix, as
#             seeded personas, against the same kind of stack (#269).
#
# The suite is NOT run without that stack. `tests/support/runnable.ts` makes a
# suite that cannot run FAIL rather than skip (T150), and eleven DB-bound
# suites take that path with no database. Excluding them by path would have
# been the easy way to a green tick and would have reproduced, in CI, exactly
# the thing that convention exists to prevent. `ALLOW_UNVERIFIED` is likewise
# not set here — it is an escape hatch for a local iteration loop, and its own
# message says never in a merge.

on:
  pull_request:
  push:
    branches: [main]
  # The whole screenshot matrix (#375): ~45 minutes, so nightly, not per push.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

# A second push to a PR cancels the first. Not on main: those runs are the
# record of what a merge did. The event is in the key so a nightly run never
# queues a merge's run behind it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, build
    # PINNED, not ubuntu-latest. The `ubuntu-latest` label migrates to Ubuntu 26
    # from 2026-10-19 — eleven days before launch. An unpinned runner would
    # change the OS, the preinstalled toolchain and the default package
    # versions underneath us in the worst week of the project, and the first
    # symptom would be a job failing for a reason unrelated to any change we
    # made. 24.04 is exactly what every run has been using; this pins what is
    # already proven rather than adopting anything new.
    #
    # Revisit after launch: this is a deliberate freeze, not a preference.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Proves itself on a known-bad fixture first, then checks every tracked
      # file ([guard-proves-itself]). Grammar: ops-pattern/process/PIPELINE.md.
      - name: Markers — open questions and guard claims
        run: bash scripts/check-markers.sh

      - name: Lint
        run: npm run lint

      # The Path: line checker issue-lint runs on every Issue and PR body. Here it
      # proves itself on its fixtures whenever the code changes ([guard-proves-itself]).
      - name: Path line checker — self-test
        run: node scripts/check-path-line.cjs --self-test

      - name: Types
        run: npx tsc --noEmit

      # The build is a real gate: it catches what neither lint nor tsc sees —
      # a server/client boundary violation, a bad route export, a module that
      # resolves in dev and not in a production bundle.
      #
      # These values are placeholders and deliberately fake. The build only
      # needs them to be present and well-formed; nothing here talks to a
      # Supabase or Mapbox instance, and a real key would be a secret in a
      # public repo for no gain.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci_placeholder
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      #
      # `version: latest` makes this step call the GitHub releases API on every
      # run. On 2026-09-21 that API rate-limited, the step failed with
      # "Failed to resolve latest Supabase CLI release", and the whole
      # migrations check went red for a reason unrelated to any migration —
      # so the one job that watches the schema was dark on the day a migration
      # merged unapplied and took every Page URL down.
      #
      # A pinned version needs no API call and cannot be rate-limited. Bump it
      # deliberately; do not put `latest` back.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      # Built from the migration files in this commit, thrown away with the
      # runner. `start` on a fresh runner applies every migration from empty,
      # in order, then the seed, which is also what makes the DB-bound suites
      # meaningful rather than merely runnable. Only the services the suites
      # reach are started (#375): Postgres, auth, REST, storage and the gateway.
      - name: Start a throwaway local stack
        run: supabase start -x "$SUPABASE_UNUSED"
        env:
          SUPABASE_UNUSED: realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: npm ci

      # Keys are generated per stack by the CLI, so they are read out of it
      # rather than hardcoded.
      - name: Read the stack's keys into the environment
        run: supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_ENV"

      # SUPABASE_TEST_EPHEMERAL is the explicit assertion T151 requires: this
      # instance is disposable. It is safe to state here precisely because the
      # stack was created three steps ago and dies with the runner.
      #
      # NEXT_PUBLIC_* are deliberately NOT set. They are what the app's own
      # client reads, and several unit suites are written against a client that
      # cannot reach anything — src/lib/media/upload-image.test.ts asserts an
      # 8MB photo is not rejected pre-resize, and reaches that assertion only
      # because the upload fails instantly. Pointing those variables at the
      # live local stack turned that instant failure into a hung socket and
      # timed the suite out. Leaving them unset is also what `npm test` does on
      # a developer's machine, so CI and local agree.
      #
      # write-safe.ts is satisfied regardless: with NEXT_PUBLIC_SUPABASE_URL
      # unset there is no protected ref to collide with, and the write-bound
      # suites judge SUPABASE_URL, which is the local stack.
      - name: Vitest
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_TEST_EPHEMERAL: '1'
        run: |
          export SUPABASE_ANON_KEY="${ANON_KEY:?supabase status did not export ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?supabase status did not export SERVICE_ROLE_KEY}"
          npm test

  # ---------------------------------------------------------------------
  # The browser suite (#269). It existed and never ran: the accepted risk
  # "the browser test suite never runs" (due 2026-10-16) is this job.
  #
  # A throwaway local stack, seeded with one persona per role
  # (scripts/seed-personas.ts, which refuses any non-local host), a production
  # build of this commit, then three Playwright runs:
  #   guard          one spec that MUST fail; this job stops if it passes
  #   mobile-chrome  the feature evals (evals/quarantine.ts lists the ones that
  #                  fail against today's rulings and are excluded, by title)
  #   screens        on a PR or a merge, the smoke slice (#375): every route
  #                  signed out at 390 and 1280px, and every route that differs
  #                  by viewer as a member and an owner at 390px. Nightly and
  #                  on demand (Actions → CI → Run workflow), the whole matrix:
  #                  every route, as every persona, at six widths. Uploaded as
  #                  the `screenshots` artifact.
  #
  # The whole matrix ran on every push until #375 and was ~45 of this job's
  # ~50 minutes. The smoke slice still loads every route on every PR.
  # ---------------------------------------------------------------------
  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 20 || 90 }}
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TEST_EPHEMERAL: '1'
      OPERATOR_MEMBER_ID: 0a000000-0000-4000-8000-000000000006
      PLAYWRIGHT_WEB_COMMAND: npm run start
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Pinned, for the reason the test job gives (#164).
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      # In the background: the stack is a minute or more of image pulls, and
      # npm ci and the browser download need none of it.
      - name: Start a throwaway local stack (background)
        run: |
          ( supabase start -x "$SUPABASE_UNUSED" > "$RUNNER_TEMP/stack.log" 2>&1; echo $? > "$RUNNER_TEMP/stack.exit" ) &
        env:
          SUPABASE_UNUSED: realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No --with-deps: the runner image already carries Chrome's libraries, and
      # the apt step it adds once stalled 11 minutes on a mirror (#375).
      - run: npx playwright install --only-shell chromium

      - name: Wait for the stack
        run: |
          for _ in $(seq 1 300); do [ -f "$RUNNER_TEMP/stack.exit" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/stack.log"
          [ "$(cat "$RUNNER_TEMP/stack.exit" 2>/dev/null)" = 0 ]

      - name: Read the stack's keys into the environment
        run: supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_ENV"

      - name: Seed the personas (local only)
        run: |
          npx tsx scripts/seed-personas.ts --check
          npx tsx scripts/seed-personas.ts --apply
          npx tsx scripts/bootstrap-eval-helpers.ts
        env:
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build against the local stack
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}

      # [guard-proves-itself]: watched failing on every run, before anything
      # below is believed.
      - name: The browser suite can fail (self-test)
        env:
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
        run: |
          if npx playwright test --project=guard; then
            echo "::error::evals/_guard/must-fail.spec.ts passed. The browser suite is not catching anything; nothing below can be believed."
            exit 1
          fi
          echo "Self-test: the must-fail spec failed, as it must."

      - name: Feature evals
        env:
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npx playwright test --project=mobile-chrome

      - name: Screenshot matrix
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SCREENS_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'smoke' || 'full' }}
        run: npx playwright test --project=screens

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Is every migration in this branch already applied to production?
  #
  # 2026-09-21: two PRs merged carrying a migration nobody had applied, the
  # deploy went out against a database without it, and every Page URL 404'd
  # for an hour. #164 pinned the CLI so the watching job stops going dark.
  # #184 added /api/health/schema so a deployment reports a schema its code
  # cannot use. Both of those NOTICE. Both fire after the merge, which is
  # after the outage has started.
  #
  # The thing that prevents it is an ordering: a migration reaches production
  # BEFORE it reaches main, applied from its own branch — which the apply
  # workflow already supports, and its own input text already tells you to do
  # ("FIRST check 'Use workflow from'"). Then the merge can never be ahead of
  # the database, because the database went first.
  #
  # `--strict` is exactly that question. The `pending` job in migrations.yml
  # asks it of main; this asks it of the branch, before the branch is main.
  #
  # NO `paths:` FILTER, DELIBERATELY. ci.yml runs on every PR, and this job
  # must too. A required check that is skipped by a path filter reports
  # nothing, and GitHub treats "nothing" as "not yet" — which blocks every
  # unrelated PR forever, and is how people learn to turn the requirement off.
  # Running always and passing quickly is what makes it safe to require.
  #
  # IT IS NOT YET A CONTROL — SEE Issue #187.
  # Making a red check actually stop a merge needs branch protection or a
  # ruleset. Both return "403 Upgrade to GitHub Pro or make this repository
  # public" on this repo's plan; that was checked against the API with an
  # admin token, not assumed. Until one of them is available this is a red
  # tick a person can merge past. It goes in now so that making it binding is
  # a setting rather than new work.
  # ---------------------------------------------------------------------
  applied:
    name: Migrations applied to production
    # On main too, so a merge that lands a migration production lacks goes red
    # where everyone sees it (2026-10-01).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # PINNED, not ubuntu-latest — same reasoning as every other job here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      # Missing secrets exit non-zero here and take the job with them. That
      # matters more than usual for this job: the failure mode being guarded
      # against is a migration going unnoticed, so a version of this check
      # that shrugs when it cannot reach the database would be worse than not
      # having it — it would be a green tick asserting something nobody asked.
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Every migration here is already in the database
        env:
          SUPABASE_DB_URL: ${{ steps.dburl.outputs.url }}
        run: |
          # Exit codes are the script's (#224): 2 pending, 3 drift, 1 could not run.
          code=0
          bash scripts/check-migration-drift.sh --strict || code=$?
          case "$code" in
            0) exit 0 ;;
            2) echo "::error::This branch carries a migration production does not have. Apply it FIRST, then merge. In a terminal: gh workflow run apply.yml --ref ${GITHUB_HEAD_REF:-<this-branch>} -f confirm=apply. Merging first is what caused the 2026-09-21 outage." ;;
            3) echo "::error::Production has a migration this branch does not (versions listed above). Do NOT apply anything. If main already carries the file, update this branch from main. If main lacks it too, something wrote to production outside the migration files: add the matching file." ;;
            *) echo "::error::The drift check could not run (exit $code). Its own message is above." ;;
          esac
          exit 1
