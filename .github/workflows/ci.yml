name: CI

# What every PR is checked against.
#
# Until this existed, "green" on a PR meant Vercel had built a preview and
# `issue-lint` had read the description. 131 unit test files, 24 Playwright
# specs and a lint script existed in the repo and none of them ran on a PR —
# every merge on 2026-09-16 was green without a single test executing.
#
# Two jobs, split on whether they need a database:
#
#   quality — lint, types, production build. Seconds, no services.
#   test    — the Vitest suite against a throwaway local Supabase.
#
# The suite is NOT run without that stack. `tests/support/runnable.ts` makes a
# suite that cannot run FAIL rather than skip (T150), and eleven DB-bound
# suites take that path with no database. Excluding them by path would have
# been the easy way to a green tick and would have reproduced, in CI, exactly
# the thing that convention exists to prevent. `ALLOW_UNVERIFIED` is likewise
# not set here — it is an escape hatch for a local iteration loop, and its own
# message says never in a merge.

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR cancels the first. Not on main: those runs are the
# record of what a merge did.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, build
    # PINNED, not ubuntu-latest. The `ubuntu-latest` label migrates to Ubuntu 26
    # from 2026-10-19 — eleven days before launch. An unpinned runner would
    # change the OS, the preinstalled toolchain and the default package
    # versions underneath us in the worst week of the project, and the first
    # symptom would be a job failing for a reason unrelated to any change we
    # made. 24.04 is exactly what every run has been using; this pins what is
    # already proven rather than adopting anything new.
    #
    # Revisit after launch: this is a deliberate freeze, not a preference.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      # The build is a real gate: it catches what neither lint nor tsc sees —
      # a server/client boundary violation, a bad route export, a module that
      # resolves in dev and not in a production bundle.
      #
      # These values are placeholders and deliberately fake. The build only
      # needs them to be present and well-formed; nothing here talks to a
      # Supabase or Mapbox instance, and a real key would be a secret in a
      # public repo for no gain.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci_placeholder
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      #
      # `version: latest` makes this step call the GitHub releases API on every
      # run. On 2026-09-21 that API rate-limited, the step failed with
      # "Failed to resolve latest Supabase CLI release", and the whole
      # migrations check went red for a reason unrelated to any migration —
      # so the one job that watches the schema was dark on the day a migration
      # merged unapplied and took every Page URL down.
      #
      # A pinned version needs no API call and cannot be rate-limited. Bump it
      # deliberately; do not put `latest` back.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      # Built from the migration files in this commit, thrown away with the
      # runner. `db reset` applies every migration from empty, in order, which
      # is also what makes the DB-bound suites meaningful rather than merely
      # runnable.
      - name: Start a throwaway local stack
        run: |
          supabase start
          supabase db reset

      - run: npm ci

      # Keys are generated per stack by the CLI, so they are read out of it
      # rather than hardcoded.
      - name: Read the stack's keys into the environment
        run: supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_ENV"

      # SUPABASE_TEST_EPHEMERAL is the explicit assertion T151 requires: this
      # instance is disposable. It is safe to state here precisely because the
      # stack was created three steps ago and dies with the runner.
      #
      # NEXT_PUBLIC_* are deliberately NOT set. They are what the app's own
      # client reads, and several unit suites are written against a client that
      # cannot reach anything — src/lib/media/upload-image.test.ts asserts an
      # 8MB photo is not rejected pre-resize, and reaches that assertion only
      # because the upload fails instantly. Pointing those variables at the
      # live local stack turned that instant failure into a hung socket and
      # timed the suite out. Leaving them unset is also what `npm test` does on
      # a developer's machine, so CI and local agree.
      #
      # write-safe.ts is satisfied regardless: with NEXT_PUBLIC_SUPABASE_URL
      # unset there is no protected ref to collide with, and the write-bound
      # suites judge SUPABASE_URL, which is the local stack.
      - name: Vitest
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_TEST_EPHEMERAL: '1'
        run: |
          export SUPABASE_ANON_KEY="${ANON_KEY:?supabase status did not export ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?supabase status did not export SERVICE_ROLE_KEY}"
          npm test

  # ---------------------------------------------------------------------
  # Is every migration in this branch already applied to production?
  #
  # 2026-09-21: two PRs merged carrying a migration nobody had applied, the
  # deploy went out against a database without it, and every Page URL 404'd
  # for an hour. #164 pinned the CLI so the watching job stops going dark.
  # #184 added /api/health/schema so a deployment reports a schema its code
  # cannot use. Both of those NOTICE. Both fire after the merge, which is
  # after the outage has started.
  #
  # The thing that prevents it is an ordering: a migration reaches production
  # BEFORE it reaches main, applied from its own branch — which the apply
  # workflow already supports, and its own input text already tells you to do
  # ("FIRST check 'Use workflow from'"). Then the merge can never be ahead of
  # the database, because the database went first.
  #
  # `--strict` is exactly that question. The `pending` job in migrations.yml
  # asks it of main; this asks it of the branch, before the branch is main.
  #
  # NO `paths:` FILTER, DELIBERATELY. ci.yml runs on every PR, and this job
  # must too. A required check that is skipped by a path filter reports
  # nothing, and GitHub treats "nothing" as "not yet" — which blocks every
  # unrelated PR forever, and is how people learn to turn the requirement off.
  # Running always and passing quickly is what makes it safe to require.
  #
  # IT IS NOT YET A CONTROL — SEE Issue #187.
  # Making a red check actually stop a merge needs branch protection or a
  # ruleset. Both return "403 Upgrade to GitHub Pro or make this repository
  # public" on this repo's plan; that was checked against the API with an
  # admin token, not assumed. Until one of them is available this is a red
  # tick a person can merge past. It goes in now so that making it binding is
  # a setting rather than new work.
  # ---------------------------------------------------------------------
  applied:
    name: Migrations applied to production
    if: github.event_name == 'pull_request'
    # PINNED, not ubuntu-latest — same reasoning as every other job here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # PINNED, not `latest`. Issue #164, and it has now cost an outage.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      # Missing secrets exit non-zero here and take the job with them. That
      # matters more than usual for this job: the failure mode being guarded
      # against is a migration going unnoticed, so a version of this check
      # that shrugs when it cannot reach the database would be worse than not
      # having it — it would be a green tick asserting something nobody asked.
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Every migration here is already in the database
        env:
          SUPABASE_DB_URL: ${{ steps.dburl.outputs.url }}
        run: |
          if bash scripts/check-migration-drift.sh --strict; then
            exit 0
          fi
          echo "::error::This branch carries a migration production does not have. Apply it FIRST, then merge: Actions -> 'Apply migrations to PRODUCTION' -> Run workflow -> set 'Use workflow from' to THIS BRANCH -> type apply. Merging first is what caused the 2026-09-21 outage."
          exit 1
