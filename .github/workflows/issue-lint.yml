name: issue-lint
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
# WITHOUT THIS THE JOB CANNOT DO THE ONE THING IT IS FOR.
# The default token is read-only for issues, so `addLabels` returned
# `403 Resource not accessible by integration` and killed the run before it
# could comment. The red tick looked like flakiness; the label never appeared,
# so `needs-fix` — which CLAUDE.md tells every agent to watch for — had never
# once been applied. Bug #189.
#
# `contents: read` too: naming any permission drops the rest to none, and on a
# private repo that leaves checkout "Repository not found". (The repo is public
# since 2026-10-05; keep the line so it still works if it goes private again.)
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    # PINNED, not ubuntu-latest. The `ubuntu-latest` label migrates to Ubuntu 26
    # from 2026-10-19 — eleven days before launch. An unpinned runner would
    # change the OS, the preinstalled toolchain and the default package
    # versions underneath us in the worst week of the project, and the first
    # symptom would be a job failing for a reason unrelated to any change we
    # made. 24.04 is exactly what every run has been using; this pins what is
    # already proven rather than adopting anything new.
    #
    # Revisit after launch: this is a deliberate freeze, not a preference.
    runs-on: ubuntu-24.04
    steps:
      # The Path: checker lives in the repo so it can prove itself on fixtures
      # before it judges a body ([guard-proves-itself]). Don's decision rule, 2026-10-04.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Path line checker — self-test
        run: node scripts/check-path-line.cjs --self-test
      - uses: actions/github-script@v8
        with:
          script: |
            const { checkPath } = require(`${process.env.GITHUB_WORKSPACE}/scripts/check-path-line.cjs`);
            const body = (context.payload.issue?.body || context.payload.pull_request?.body || "");
            const num = context.payload.issue?.number || context.payload.pull_request?.number;
            const isPR = !!context.payload.pull_request;
            const problems = [];

            if (!isPR) {
              // `[*_\s]*` BECAUSE THE TEMPLATE IS MARKDOWN AND THIS READS RAW TEXT.
              // .github/ISSUE_TEMPLATE/work.md emits `**Kind:** bug`, so what
              // follows `Kind:` is `**`, which the old `\s*` could not cross.
              // Every issue opened from this repo's own template was judged to
              // be missing the two fields it had just filled in. Bug #189.
              const kindMatch = body.match(/Kind:[*_\s]*(scenario|change|bug|chore)\b/i);
              const scenarioMatch = body.match(/Scenario:[*_\s]*(F\d+|none)\b/i);
              if (!kindMatch) problems.push("missing `Kind:` (scenario|change|bug|chore)");
              if (!scenarioMatch) problems.push("missing `Scenario:` (F### or none)");
              const kind = kindMatch?.[1]?.toLowerCase();
              const isUat = (context.payload.issue?.labels || []).some((l) => l.name === "uat"); // a UAT Issue is a checklist by design
              if (!isUat && kind && kind !== "scenario" && /- \[[ x]\]/i.test(body)) {
                problems.push("has acceptance checkboxes but is kind `" + kind + "` — that's a scenario");
              }
            } else {
              if (!/#\d+/.test(body)) problems.push("cites no Issue (`#123` or `closes #123`)");
            }

            const pathProblem = checkPath(body);
            if (pathProblem) problems.push(pathProblem);

            const label = "needs-fix";
            const { owner, repo } = context.repo;
            if (problems.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: [label] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: "needs-fix:\n" + problems.map(p => "- " + p).join("\n"),
              });
              if (pathProblem) core.setFailed(pathProblem);
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: num, name: label });
              } catch (e) {}
            }
