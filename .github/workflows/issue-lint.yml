name: issue-lint
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
jobs:
  lint:
    # PINNED, not ubuntu-latest. The `ubuntu-latest` label migrates to Ubuntu 26
    # from 2026-10-19 — eleven days before launch. An unpinned runner would
    # change the OS, the preinstalled toolchain and the default package
    # versions underneath us in the worst week of the project, and the first
    # symptom would be a job failing for a reason unrelated to any change we
    # made. 24.04 is exactly what every run has been using; this pins what is
    # already proven rather than adopting anything new.
    #
    # Revisit after launch: this is a deliberate freeze, not a preference.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const body = (context.payload.issue?.body || context.payload.pull_request?.body || "");
            const num = context.payload.issue?.number || context.payload.pull_request?.number;
            const isPR = !!context.payload.pull_request;
            const problems = [];

            if (!isPR) {
              const kindMatch = body.match(/Kind:\s*(scenario|change|bug|chore)/i);
              const scenarioMatch = body.match(/Scenario:\s*(F\d+|none)/i);
              if (!kindMatch) problems.push("missing `Kind:` (scenario|change|bug|chore)");
              if (!scenarioMatch) problems.push("missing `Scenario:` (F### or none)");
              const kind = kindMatch?.[1]?.toLowerCase();
              if (kind && kind !== "scenario" && /- \[[ x]\]/i.test(body)) {
                problems.push("has acceptance checkboxes but is kind `" + kind + "` — that's a scenario");
              }
            } else {
              if (!/#\d+/.test(body)) problems.push("cites no Issue (`#123` or `closes #123`)");
            }

            const label = "needs-fix";
            const { owner, repo } = context.repo;
            if (problems.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: [label] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: "needs-fix:\n" + problems.map(p => "- " + p).join("\n"),
              });
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: num, name: label });
              } catch (e) {}
            }
