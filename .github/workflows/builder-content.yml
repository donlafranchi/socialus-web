name: Builder content

# #388 — what the builder agents made, all at once (Don, 2026-10-05). From the
# GitHub iOS app: Actions → Builder content → Run workflow → pick an action.
#   status  the switch, and how many Pages and Posts
#   hide    hidden from members at once; show undoes it
#   show    showing to members again
#   delete  every row a builder made, and their photo files; type DELETE to confirm
# Member-made content is never touched. The builder accounts stay.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status, hide, show or delete'
        required: true
        type: choice
        options: [status, hide, show, delete]
      confirm:
        description: 'For delete only: type DELETE'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: builder-content
  cancel-in-progress: false

jobs:
  run:
    name: Builder content
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete needs the word DELETE
        if: inputs.action == 'delete' && inputs.confirm != 'DELETE'
        run: |
          echo "::error::To delete, type DELETE in the confirm box. Nothing was changed."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Fetch the service role key
        id: keys
        if: inputs.action == 'delete'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          key="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[] | select(.name == "service_role") | .api_key')"
          [ -n "$key" ] || { echo "::error::Could not read the service role key."; exit 1; }
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.key }}
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          ACTION: ${{ inputs.action }}
        run: npx tsx scripts/builder-content.ts "$ACTION" | tee -a "$GITHUB_STEP_SUMMARY"
