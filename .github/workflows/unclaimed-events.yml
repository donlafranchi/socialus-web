name: Venue shows import

# #997 (the PM, 2026-10-22) — every morning, read each venue Page's own events page or feed and post its next 60 days of
# shows; over, cancelled and dropped shows come off. Idempotent. #1485: a venue that fails three mornings in a row gets
# an Issue (one open Issue per venue); the count of mornings lives in the Actions cache. By hand: gh workflow run
# unclaimed-events.yml (dry run unless write is ticked; only narrows to one venue; never counts mornings or files).
on:
  schedule:
    - cron: '15 13 * * *' # daily 06:15 Pacific (05:15 in winter)
  workflow_dispatch:
    inputs:
      write:
        description: 'Tick to write to the production database. Unticked, it only reads the venues.'
        required: false
        type: boolean
        default: false
      only:
        description: 'Only venues whose name contains this (blank: all)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: unclaimed-load
  cancel-in-progress: false

jobs:
  import:
    name: Import venue shows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Show pictures go through the Storage API, which needs the service role key (same step as the unclaimed load).
      - uses: supabase/setup-cli@v2
        if: github.event_name == 'schedule' || inputs.write
        with:
          version: 2.117.0
      - name: Fetch the service role key
        id: keys
        if: github.event_name == 'schedule' || inputs.write
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          key="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[] | select(.name == "service_role") | .api_key')"
          [ -n "$key" ] || { echo "::error::Could not read the service role key."; exit 1; }
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the count of mornings each venue has failed
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .venue-strikes.json
          key: venue-strikes-${{ github.run_id }}
          restore-keys: venue-strikes-
      - name: Import
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.key }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          ONLY: ${{ inputs.only }}
          BROKEN_FILE: ${{ runner.temp }}/broken.json
          STRIKES_FILE: ${{ github.event_name == 'schedule' && '.venue-strikes.json' || '' }}
          FILE_FILE: ${{ runner.temp }}/to-file.json
        run: |
          args=()
          [ "$WRITE" = "true" ] && args+=(--apply)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          npx tsx scripts/unclaimed/events.ts "${args[@]}"
      - name: Save the count of mornings
        if: always() && github.event_name == 'schedule' && hashFiles('.venue-strikes.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .venue-strikes.json
          key: venue-strikes-${{ github.run_id }}
      - name: File an Issue for each venue broken three mornings in a row
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_FILE: ${{ runner.temp }}/to-file.json
        run: |
          [ -s "$FILE_FILE" ] || exit 0
          jq -c '.[]' "$FILE_FILE" | while read -r v; do
            name=$(jq -r .name <<<"$v"); url=$(jq -r .url <<<"$v"); err=$(jq -r .error <<<"$v")
            title="bug · Venue shows import broke: $name"
            if gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number' | grep -q .; then continue; fi
            printf '**Kind:** bug\n**Scenario:** none\n**Path:** well-worn — fix the venue parser or its feed address (#997).\n\nThe daily venue shows import could not read **%s** (%s) three mornings in a row: %s\n\nIts existing posts were left as they are. Run: %s/%s/actions/runs/%s\n' \
              "$name" "$url" "$err" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > body.md
            gh issue create --title "$title" --body-file body.md
          done
      # #1173 — a one-morning outage (a feed timing out) heals itself: once a full run reads the venue again, its Issue closes.
      - name: Close the Issue of each venue that reads again
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN_FILE: ${{ runner.temp }}/broken.json
        run: |
          [ -f "$BROKEN_FILE" ] || exit 0
          prefix='bug · Venue shows import broke: '
          gh issue list --state open --search "\"$prefix\" in:title" --limit 100 --json number,title | jq -c '.[]' | while read -r i; do
            title=$(jq -r .title <<<"$i"); name=${title#"$prefix"}
            [ "$name" != "$title" ] || continue
            jq -e --arg n "$name" 'any(.[]; .name == $n)' "$BROKEN_FILE" >/dev/null && continue
            gh issue close "$(jq -r .number <<<"$i")" --comment "Read again in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, so this closes on its own."
          done
