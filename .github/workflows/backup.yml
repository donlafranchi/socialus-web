name: Backup

# Our own nightly backup of production (#1259, INFRASTRUCTURE.md §10).
#
# Supabase Pro keeps 7 days of daily snapshots, but they are lost with the
# account, and they do NOT include Storage objects (Supabase docs, Database
# Backups: "Database backups do not include objects you store via the Storage
# API"). So this takes, every night:
#   - pg_dump --no-owner --no-privileges -Fc of the database
#   - every object in the `media` bucket
#   - exact row counts from the same snapshot, so the monthly restore test
#     (backup-restore-test.yml) can prove the dump came back whole
#
# THE REPO IS PUBLIC, and so are its Actions artifacts. Everything is encrypted
# with `age` on the runner before it is uploaded; nothing readable leaves. The
# key is the BACKUP_AGE_KEY secret, which only the PM holds a copy of.
#
# Kept as an Actions artifact: 30 days for a nightly, 90 (the public-repo
# maximum) for the one taken on the 1st, so there is always ~3 months of
# monthlies plus a month of nightlies. Outgrow that (artifacts are capped per
# run and per repo) and the next step is Backblaze B2, per §10.
#
# Connects through the Supavisor pooler in session mode, not the direct host
# §10 suggests: the direct host is IPv6-only and GitHub runners are IPv4-only
# (scripts/supabase-db-url.sh). Session mode is a real per-client connection,
# which is what pg_dump and its exported snapshot need.

on:
  schedule:
    - cron: '17 10 * * *'   # 10:17 UTC = 2–3 am Pacific, quietest hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, keep
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: The encryption key is set
        env:
          BACKUP_AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
        run: |
          if [ -z "$BACKUP_AGE_KEY" ]; then
            echo "::error::BACKUP_AGE_KEY is not set, so nothing can be encrypted and nothing is backed up. On a Mac: brew install age && age-keygen -o ~/socialus-backup.key && gh secret set BACKUP_AGE_KEY -R ${{ github.repository }} < ~/socialus-backup.key — then keep that file in a password manager."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install age and the Postgres 17 client
        run: bash scripts/backup/install-tools.sh

      - name: Build the database connection string
        id: dburl
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(bash scripts/supabase-db-url.sh)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Dump the database and the media bucket
        env:
          DB_URL: ${{ steps.dburl.outputs.url }}
          OUT_DIR: ${{ runner.temp }}/backup
          PG_BIN: /usr/lib/postgresql/17/bin
          MEDIA_BASE: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
        run: bash scripts/backup/dump.sh

      # Encrypt, then prove the file decrypts and holds the dump BEFORE the
      # plaintext is deleted and the ciphertext uploaded.
      - name: Encrypt
        id: enc
        env:
          BACKUP_AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
          SRC: ${{ runner.temp }}/backup
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          out="$RUNNER_TEMP/socialus-backup-$day.tar.age"
          KEY_TEXT="$BACKUP_AGE_KEY" OUT="$out" bash scripts/backup/encrypt.sh
          rm -rf "$SRC"
          if [ "$(date -u +%d)" = 01 ]; then keep=90; else keep=30; fi
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "name=socialus-backup-$day" >> "$GITHUB_OUTPUT"
          echo "keep=$keep" >> "$GITHUB_OUTPUT"
          echo "Encrypted backup $(du -h "$out" | cut -f1), kept $keep days." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.enc.outputs.name }}
          path: ${{ steps.enc.outputs.file }}
          retention-days: ${{ steps.enc.outputs.keep }}
          compression-level: 0   # ciphertext does not compress
          if-no-files-found: error

      - name: Open or update the Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="bug · nightly backup failed"
          existing="$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "Failed again: $RUN"
          else
            gh issue create -R "$REPO" --title "$title" --label bug --label area:ops --body "Last night's backup of production did not complete: $RUN

          Supabase's own 7-day snapshot still covers the database meanwhile, but not photos. Fix forward; the run log says which step.

          Kind: bug
          Scenario: none
          Path: well-worn. Precedent: post-run alarm Issues (main-build-alarm.yml, smoke-live.yml).

          @donlafranchi"
          fi
