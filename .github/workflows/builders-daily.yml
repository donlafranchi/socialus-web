name: Builders (daily)

# #346 — the builder accounts keep the app full: each day, a few new invented
# organizations from evals/builders/roster.ts, a new post or event for each one
# already running, follows and RSVPs between them. Every run uploads its
# screenshots, friction log and a phone-width storyboard. Builder content is
# invisible to real members (#280) and removed before launch.
#
# The schedule waits for the repository variable BUILDERS_DAILY_ENABLED=true,
# set once the one-question Create (#326) is live; manual runs always work.
# One run at a time, two Playwright workers at most (build rules).

on:
  schedule:
    - cron: '17 15 * * *' # 08:17 Pacific
  workflow_dispatch:
    inputs:
      new_per_kind:
        description: 'New organizations per Page kind this run'
        required: false
        default: '2'

permissions:
  contents: read

concurrency:
  group: builders-daily
  cancel-in-progress: false

jobs:
  run:
    name: Builder journeys
    if: github.event_name == 'workflow_dispatch' || vars.BUILDERS_DAILY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Journeys against the live app
        env:
          BUILDERS_BASE_URL: https://www.socialus.org
          BUILDER_SEED: ${{ secrets.BUILDER_SEED }}
          BUILDER_NEW_PER_KIND: ${{ inputs.new_per_kind || '2' }}
          BUILDER_OUT: builder-runs/${{ github.run_id }}
        run: |
          [ -n "$BUILDER_SEED" ] || { echo "::error::BUILDER_SEED is not set."; exit 1; }
          npx playwright test --project=builders --workers=2 --reporter=line || echo "::warning::Some journeys got stuck; see the friction log."

      - name: Storyboard
        if: always()
        run: |
          [ -f "builder-runs/${{ github.run_id }}/manifest.json" ] && npx tsx scripts/builders/storyboard.ts "builder-runs/${{ github.run_id }}" || echo "No manifest; nothing ran."

      - name: Friction log in the summary
        if: always()
        run: cat "builder-runs/${{ github.run_id }}/friction.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: builder-run-${{ github.run_id }}
          path: builder-runs/${{ github.run_id }}
          retention-days: 30
